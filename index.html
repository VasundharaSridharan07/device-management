<!doctype html>
<html lang="en" class="light" data-theme="modus-modern-light" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Device Management</title>
    <meta
      name="description"
      content="Device Management prototype — Trimble Modus app shell."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/modus-web-components/modus-icons.css" />
    <script>
      (function () {
        var mode = 'light';
        try {
          var config = JSON.parse(
            localStorage.getItem('modus-theme-config') || 'null',
          );
          var stored = (config && config.mode) || localStorage.getItem('theme');
          if (stored === 'dark' || stored === 'light') {
            mode = stored;
          }
        } catch (e) {}
        var html = document.documentElement;
        html.setAttribute('data-theme', 'modus-modern-' + mode);
        html.setAttribute('data-mode', mode);
        html.classList.remove('light', 'dark');
        html.classList.add(mode);
        localStorage.setItem('theme', mode);
        localStorage.setItem(
          'modus-theme-config',
          JSON.stringify({ theme: 'modus-modern', mode: mode }),
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
